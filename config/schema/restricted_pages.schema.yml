# Schema for the configuration files of the restricted_pages module.

restricted_pages.settings:
  type: config_object
  label: 'Present settings'
  mapping:
    user_code_cookied_validity:
      type: string
      label: 'Valid for Days'
    registration_form_mode:
      type: string
      label: 'Registration Form Mode'

restricted_pages.restricted_page.*:
  type: config_entity
  label: 'Restricted Page'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    status:
      type: boolean
      label: 'Status'
    path:
      type: string
      label: 'Path'
